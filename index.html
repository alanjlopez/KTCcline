<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kill the Crows — HTML edition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The whole game renders here; HTML overlays sit on top for crisp text. -->
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="overlays"></div>

  <!-- Classic scripts sharing window.KTC so the game runs straight from
       file:// (no build step, no modules, no external assets). Order matters:
       utilities and namespaces load before the code that captures them. -->
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/trinkets.js"></script>
  <script src="js/items.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/loot.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/player.js"></script>
  <script src="js/level.js"></script>
  <script src="js/save.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
